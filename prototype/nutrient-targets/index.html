<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nutrient Targets</title>
<!--
  LOCKED. Wayfinder issue #14 (child of map #1), resolved: "Category
  tabs + inline steppers" — a segmented control (Macros & Water /
  Micronutrients / Watched) switches groups, and every row edits in
  place with inline −/+ steppers, no modal or navigation — chosen over
  two alternates (Grouped list + bottom sheet, Tile dashboard +
  dedicated edit panel). Calories is included and editable the same
  way as any other target: it's a Nutrient Target too (per CONTEXT.md,
  "Adjustable per Account" applies to the Calorie Target as well),
  normally seeded from TDEE + Goal and recalculated weekly, but
  overridable here like the rest. See issue #14 for the full
  comparison; the three-variant exploration lives on branch
  prototype/nutrient-targets-variants.

  Visual identity (color, type, tab bar, light theme) is locked from
  issue #9. The Tailwind config + gradient/CSS-token block below is
  copied verbatim from prototype/logging-flow-home/index.html (issue
  #10) per map #1's Notes — do not re-derive.
-->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#F3F1EA',
          surface: '#FFFFFF',
          ink: '#1B1A17',
          muted: '#79746C',
          line: '#E9E4D8',
          brand: '#7FA636',
          cal: '#E15A2B',
          protein: '#8B5FBF',
          carbs: '#C98A16',
          fat: '#2E9E78',
          water: '#2E86AB',
        },
        fontFamily: {
          display: ['"Plus Jakarta Sans"', 'sans-serif'],
          body: ['"Inter"', 'sans-serif'],
        },
        borderRadius: {
          '2xl': '1.1rem',
          '3xl': '1.75rem',
        },
      },
    },
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Plus Jakarta Sans', sans-serif; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .shadow-soft { box-shadow: 0 1px 2px rgba(27,26,23,0.03), 0 6px 16px -10px rgba(27,26,23,0.08); }
  .shadow-soft-lg { box-shadow: 0 1px 3px rgba(27,26,23,0.04), 0 16px 32px -16px rgba(27,26,23,0.14); }
  details > summary { list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] .chev { transform: rotate(180deg); }
  .phone { height: 812px; }

  /* whole-canvas backdrop — one quiet warm wash, not a rainbow mesh. Apple's restraint: */
  /* the color lives in the data, the backdrop just sets a calm stage.                  */
  body {
    background:
      radial-gradient(circle at 20% 0%, rgba(255,178,120,0.22) 0%, transparent 55%),
      radial-gradient(circle at 85% 100%, rgba(126,190,150,0.16) 0%, transparent 55%),
      linear-gradient(165deg, #F8F4EA 0%, #EEE7D6 100%);
    background-attachment: fixed;
  }

  /* full-bleed gradient banner behind each screen's header + hero — replaces the blob glow */
  .hero-wash { background: linear-gradient(165deg, #FFE4C2 0%, #FCF0E0 45%, #FFFFFF 80%); }

  /* gradient fills — vivid, used only where an accent belongs (bars, badges) */
  .grad-cal     { background: linear-gradient(135deg, #FF7A3D 0%, #DE3F0F 100%); }
  .grad-protein { background: linear-gradient(135deg, #B283F0 0%, #7331C4 100%); }
  .grad-carbs   { background: linear-gradient(135deg, #F5B62E 0%, #C67200 100%); }
  .grad-fat     { background: linear-gradient(135deg, #35DBA0 0%, #0A8B5E 100%); }
  .grad-water   { background: linear-gradient(135deg, #35B6F0 0%, #0968A0 100%); }
  .grad-brand   { background: linear-gradient(135deg, #A9DE5B 0%, #558016 100%); }
  .grad-ink     { background: linear-gradient(160deg, #322F27 0%, #121108 100%); }

  /* subtle sheen for standalone cards/buttons — not used on list rows (see entry-row) */
  .sheen { background: linear-gradient(165deg, #FFFFFF 0%, #F5F1E6 100%); }

  /* ---- nutrient-targets-only additions ---- */

  /* category dot — carries the macro/water hue on list rows without a full icon */
  .cat-dot { width: 9px; height: 9px; border-radius: 999px; flex-shrink: 0; }

  /* "adjusted from default" tag — quiet, not a verdict chip (that vocabulary means met/watch/miss) */
  .tag-adjusted { font-size: 10px; font-weight: 700; letter-spacing: .01em; color: #4C6B1F; background: #EFF6E4; border: 1px solid #A9C97E; border-radius: 999px; padding: 2px 7px; white-space: nowrap; }

  /* segmented category tabs — same idiom as the duration selector on Weight Trend */
  .cat-tab { transition: background-color .15s, color .15s; }
  .cat-tab.active { background: #1B1A17; color: #FFFFFF; }
  .cat-tab:not(.active) { color: #79746C; }
</style>
</head>
<body class="text-ink">

  <div class="min-h-screen flex items-start justify-center py-10 px-4">
    <div class="w-full max-w-[390px]">

      <!-- ============================================================ -->
      <!-- LOCKED: "Category tabs + inline steppers" — segmented control -->
      <!-- switches Macros & Water / Micronutrients / Watched groups;    -->
      <!-- every row, including Calories, edits in place                -->
      <!-- ============================================================ -->
      <section id="nutrient-targets-screen" class="phone bg-surface rounded-3xl border border-line shadow-soft-lg overflow-hidden flex flex-col relative">
        <div class="flex-1 overflow-y-auto no-scrollbar">

          <div class="hero-wash">
            <div class="px-6 pt-8 pb-2 flex items-center justify-between">
              <button class="w-9 h-9 rounded-full bg-surface shadow-soft flex items-center justify-center text-ink active:scale-95 transition-transform"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
              <div class="text-center">
                <p class="text-[11px] text-ink/55 font-semibold uppercase tracking-wide">Settings</p>
                <p class="font-display font-bold text-base mt-0.5">Nutrient Targets</p>
              </div>
              <span class="w-9 h-9"></span>
            </div>

            <div class="px-6 pt-5 pb-6">
              <div class="rounded-2xl grad-cal text-white p-4 shadow-soft-lg">
                <div class="flex items-center justify-between">
                  <div>
                    <p class="text-[11px] font-semibold uppercase tracking-wide text-white/70 mb-1 flex items-center gap-1.5">Calories <span id="tag-calories"></span></p>
                    <p class="font-display font-extrabold text-2xl tabular-nums"><span id="val-calories">2,000 kcal</span></p>
                  </div>
                  <div class="flex items-center gap-2">
                    <button onclick="stepTarget('calories',-1)" class="w-8 h-8 rounded-full bg-white/15 text-white text-lg font-bold flex items-center justify-center active:scale-90 transition-transform">−</button>
                    <button onclick="stepTarget('calories',1)" class="w-8 h-8 rounded-full bg-white/15 text-white text-lg font-bold flex items-center justify-center active:scale-90 transition-transform">+</button>
                  </div>
                </div>
                <p class="text-[11px] text-white/60 mt-2.5 leading-snug">Auto-calculated from TDEE &amp; Goal, normally updates weekly — override here to set it yourself instead.</p>
              </div>
            </div>
          </div>

          <div class="px-6 pt-5">
            <div class="flex items-center gap-1.5 bg-bg rounded-full p-1">
              <button class="cat-tab active flex-1 py-2 rounded-full text-xs font-semibold" data-cat="macros" onclick="switchCat('macros')">Macros &amp; Water</button>
              <button class="cat-tab flex-1 py-2 rounded-full text-xs font-semibold" data-cat="micro" onclick="switchCat('micro')">Micronutrients</button>
              <button class="cat-tab flex-1 py-2 rounded-full text-xs font-semibold" data-cat="watched" onclick="switchCat('watched')">Watched</button>
            </div>
          </div>

          <div class="px-6 pt-5 pb-28">
            <div id="cat-macros" class="cat-panel divide-y divide-line/70"></div>
            <div id="cat-micro" class="cat-panel divide-y divide-line/70 hidden">
              <p class="text-xs text-muted pb-3">Fixed set of 8, same for every Account</p>
            </div>
            <div id="cat-watched" class="cat-panel divide-y divide-line/70 hidden"></div>
          </div>
        </div>

        <nav class="border-t border-line bg-surface px-6 py-3 flex items-center justify-between">
          <button class="flex flex-col items-center gap-1 text-muted">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
            <span class="text-[11px] font-medium">Log</span>
          </button>
          <button class="flex flex-col items-center gap-1 text-muted">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M12 20V4M20 20v-7"/></svg>
            <span class="text-[11px] font-medium">Progress</span>
          </button>
          <button class="flex flex-col items-center gap-1 text-brand">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h6M14 6h6M4 12h10M18 12h2M4 18h6M14 18h6"/><circle cx="12" cy="6" r="2" fill="#FFF"/><circle cx="16" cy="12" r="2" fill="#FFF"/><circle cx="12" cy="18" r="2" fill="#FFF"/></svg>
            <span class="text-[11px] font-semibold">Settings</span>
          </button>
        </nav>
      </section>

    </div>
  </div>

  <script>
    // Nutrient Target data (per-account defaults from issue #5 / ADR-0005). Calories is
    // normally auto-set (TDEE + Goal, recalculated weekly) but overridable here like any
    // other target.
    const CALORIES = { key: 'calories', name: 'Calories', value: 2000, default: 2000, unit: ' kcal', step: 50, color: 'cal' };
    const MACROS = [
      { key: 'protein', name: 'Protein', value: 130, default: 130, unit: 'g', step: 5, color: 'protein' },
      { key: 'carbs',   name: 'Carbs',   value: 220, default: 220, unit: 'g', step: 5, color: 'carbs' },
      { key: 'fat',     name: 'Fat',     value: 65,  default: 65,  unit: 'g', step: 5, color: 'fat' },
      { key: 'water',   name: 'Water',   value: 3.5, default: 3.0, unit: 'L', step: 0.1, color: 'water' },
    ];
    const MICRO = [
      { key: 'vitd',       name: 'Vitamin D',   value: 20,   default: 20,   unit: 'mcg', step: 1 },
      { key: 'calcium',    name: 'Calcium',     value: 1300, default: 1300, unit: 'mg',  step: 50 },
      { key: 'iron',       name: 'Iron',        value: 22,   default: 18,   unit: 'mg',  step: 1 },
      { key: 'potassium',  name: 'Potassium',   value: 4700, default: 4700, unit: 'mg',  step: 100 },
      { key: 'b12',        name: 'Vitamin B12', value: 2.4,  default: 2.4,  unit: 'mcg', step: 0.1 },
      { key: 'vitc',       name: 'Vitamin C',   value: 90,   default: 90,   unit: 'mg',  step: 5 },
      { key: 'magnesium',  name: 'Magnesium',   value: 420,  default: 420,  unit: 'mg',  step: 10 },
      { key: 'zinc',       name: 'Zinc',        value: 11,   default: 11,   unit: 'mg',  step: 1 },
    ];
    const WATCHED = [
      { key: 'fiber',  name: 'Fiber',       value: 28,   default: 28,   unit: 'g',  step: 1 },
      { key: 'sugar',  name: 'Added Sugar', value: 50,   default: 50,   unit: 'g',  step: 5 },
      { key: 'sodium', name: 'Sodium',      value: 2300, default: 2300, unit: 'mg', step: 50 },
    ];
    const ALL = [CALORIES, ...MACROS, ...MICRO, ...WATCHED];
    const byKey = key => ALL.find(i => i.key === key);
    const fmt = n => (Number.isInteger(n) ? n : Math.round(n * 10) / 10).toLocaleString();

    function adjustedTag(item) {
      return item.value !== item.default
        ? '<span class="tag-adjusted">Adjusted</span>'
        : '';
    }

    function row(item) {
      const dot = item.color ? `<span class="cat-dot grad-${item.color}"></span>` : '';
      return `<div class="flex items-center gap-3 py-3">
        ${dot}
        <span class="flex-1 min-w-0 flex items-center gap-2 text-sm font-medium truncate">${item.name} <span id="tag-${item.key}">${adjustedTag(item)}</span></span>
        <div class="flex items-center gap-2">
          <button onclick="stepTarget('${item.key}',-1)" class="w-7 h-7 rounded-full bg-bg text-ink font-bold flex items-center justify-center active:scale-90 transition-transform">−</button>
          <span id="val-${item.key}" class="w-20 text-center text-sm font-bold tabular-nums">${fmt(item.value)}${item.unit}</span>
          <button onclick="stepTarget('${item.key}',1)" class="w-7 h-7 rounded-full bg-bg text-ink font-bold flex items-center justify-center active:scale-90 transition-transform">+</button>
        </div>
      </div>`;
    }

    function render() {
      document.getElementById('val-calories').textContent = fmt(CALORIES.value) + CALORIES.unit;
      document.getElementById('tag-calories').innerHTML = adjustedTag(CALORIES);
      document.getElementById('cat-macros').innerHTML = MACROS.map(row).join('');
      const microPanel = document.getElementById('cat-micro');
      microPanel.innerHTML = '<p class="text-xs text-muted pb-3">Fixed set of 8, same for every Account</p>' + MICRO.map(row).join('');
      document.getElementById('cat-watched').innerHTML = WATCHED.map(row).join('');
    }

    function stepTarget(key, dir) {
      const item = byKey(key);
      item.value = Math.max(0, Math.round((item.value + dir * item.step) * 10) / 10);
      document.getElementById('val-' + key).textContent = fmt(item.value) + item.unit;
      document.getElementById('tag-' + key).innerHTML = adjustedTag(item);
    }

    function switchCat(cat) {
      document.querySelectorAll('.cat-tab').forEach(el => el.classList.toggle('active', el.dataset.cat === cat));
      document.querySelectorAll('.cat-panel').forEach(el => el.classList.toggle('hidden', el.id !== 'cat-' + cat));
    }

    render();
  </script>

</body>
</html>
